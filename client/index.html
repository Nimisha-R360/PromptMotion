<!doctype html>
<html lang="en" class="dark h-full antialiased" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Motion — animated HTML video studio</title>
    <!-- apply the saved light/dark choice before first paint (no flash); next-themes keeps it in sync afterwards -->
    <script>
      try {
        var t = localStorage.getItem("theme") || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="Turn prompts or slides into standalone animated HTML videos built from Remotion, anime.js, Motion and GSAP components." />
  </head>
  <body class="h-full overflow-hidden bg-background text-foreground">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
